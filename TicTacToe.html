<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>

    <style>
        body {
            font-family: "Poppins", sans-serif;
            text-align: center;
            margin-top: 40px;
            background: #1e3c72;  /* darker blue */
            background: linear-gradient(to right, #2a5298, #1e3c72);
            color: white;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 36px;
            text-shadow: 2px 2px 5px #00000050;
        }

        /* Make the board stand out */
        #board {
            width: 330px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 110px);
            gap: 8px;
            background: rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 15px;
        }

        .box {
            width: 110px;
            height: 110px;
            background: #ffffff;
            font-size: 45px;
            font-weight: bold;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.25s;
            border: 3px solid #00000055; /* visible border */
        }

        .box:hover {
            transform: scale(1.08);
            background: #f0f3f4;
        }

        #result {
            margin-top: 25px;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 2px 2px 5px #00000060;
        }

        button {
            margin-top: 25px;
            padding: 12px 30px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            background: #f1c40f;
            color: #2c3e50;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.25s;
            box-shadow: 0 4px 10px #00000050;
        }

        button:hover {
            background: #f39c12;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <h1> Tic Tac Toe</h1>

    <div id="board"></div>

    <div id="result"></div>

    <button onclick="resetGame()">Reset Game</button>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let gameActive = true;

        const winPatterns = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        const boardDiv = document.getElementById("board");

        function drawBoard() {
            boardDiv.innerHTML = "";
            board.forEach((value, index) => {
                const box = document.createElement("div");
                box.classList.add("box");
                box.textContent = value;

                if (value === "X") box.style.color = "#e74c3c";   // red X
                if (value === "O") box.style.color = "#2ecc71";   // green O

                box.onclick = () => boxClick(index);
                boardDiv.appendChild(box);
            });
        }

        function boxClick(index) {
            if (!gameActive) return;
            if (board[index] !== "") return;

            board[index] = currentPlayer;
            drawBoard();

            if (checkWinner()) {
                document.getElementById("result").textContent = currentPlayer + " Wins! ";
                gameActive = false;
                return;
            }

            if (!board.includes("")) {
                document.getElementById("result").textContent = "It's a Draw! ";
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
        }


        function checkWinner() {
            for (let pattern of winPatterns) {
                let [a, b, c] = pattern;
                if (board[a] && board[a] === board[b] && board[b] === board[c]) {
                    return true;
                }
            }
            return false;
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            gameActive = true;
            document.getElementById("result").textContent = "";
            drawBoard();
        }

        drawBoard();
    </script>

</body>
</html>
